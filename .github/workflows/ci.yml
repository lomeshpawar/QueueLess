name: QueueLess CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: Build React frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: QueueLess/client/package-lock.json

      - name: Install frontend dependencies
        working-directory: QueueLess/client
        run: npm ci

      - name: Build frontend for GitHub Pages
        working-directory: QueueLess/client
        run: npm run build -- --base=/QueueLess/

  backend-validation:
    name: Install dependencies, run unit tests and check backend syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: QueueLess/server/package-lock.json

      - name: Install backend dependencies
        working-directory: QueueLess/server
        run: npm ci

      - name: Run database-free backend unit tests
        working-directory: QueueLess/server
        run: npm test

      - name: Check backend JavaScript syntax
        working-directory: QueueLess/server
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -r -n1 node --check

      # The destructive API scenario runner is intentionally excluded.
      # Run it only against a disposable database whose name ends in _test.
