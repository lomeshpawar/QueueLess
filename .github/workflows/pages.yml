name: Deploy Frontend Preview to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "QueueLess/client/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: QueueLess/client/package-lock.json
      - name: Install dependencies
        working-directory: QueueLess/client
        run: npm ci
      - name: Build static frontend preview
        working-directory: QueueLess/client
        run: npm run build -- --base=/QueueLess/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: QueueLess/client/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
